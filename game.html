<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spelling Bee 2027 – Daily Exam</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=M+PLUS+Rounded+1c:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap">
    <link rel="stylesheet" href="app.css">
    <script src="app.js"></script>
</head>
<body>
    <a class="skip-link" href="#main">Skip to main content</a>

    <header class="site-header">
        <a class="brand" href="index.html">
            <svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true"><ellipse cx="12" cy="10" rx="7" ry="5" fill="#EDE6FA" stroke="#6B4FA0" stroke-width="1.5"/><ellipse cx="24" cy="10" rx="7" ry="5" fill="#EDE6FA" stroke="#6B4FA0" stroke-width="1.5"/><ellipse cx="18" cy="21" rx="11" ry="10" fill="#F6C453" stroke="#2A1F3D" stroke-width="2"/><path d="M10 18h16M9 24h18" stroke="#2A1F3D" stroke-width="3" stroke-linecap="round"/></svg>
            <span>Spelling Bee <span class="brand-year">2027</span></span>
        </a>
        <nav class="main-nav" aria-label="Main">
            <a href="index.html" data-nav="home">Home</a>
            <a href="game.html" data-nav="exam">Daily Exam</a>
            <a href="game.html?view=study" data-nav="study">Study</a>
            <a href="parent.html" data-nav="parent">Parent</a>
        </nav>
        <div class="header-tools">
            <label for="word-list">Word list</label>
            <select id="word-list" class="select"></select>
            <div class="user-chip"><span class="avatar-initial" aria-hidden="true">V</span><span>Vivian</span></div>
        </div>
    </header>

    <!-- ===================== DAILY EXAM ===================== -->
    <main id="main" class="page" hidden data-view="exam">
        <div class="exam-head">
            <div class="exam-head-left">
                <h1>Daily Exam</h1>
                <div class="mode-row">
                    <label for="mode-select">Practice:</label>
                    <select id="mode-select" class="select"></select>
                </div>
            </div>
            <div class="exam-progress">
                <div class="exam-progress-labels"><span id="word-count">Word 1 of 33</span><span id="today-count" style="color: var(--primary-ink)">0 correct today</span></div>
                <div class="bar" role="progressbar" id="goal-bar" aria-label="Daily goal" aria-valuemin="0" aria-valuemax="33" aria-valuenow="0"><div class="bar-fill" id="goal-fill" style="width: 0%"></div></div>
            </div>
        </div>

        <div id="exam-area"></div>
    </main>

    <!-- ===================== STUDY ===================== -->
    <main id="main-study" class="page" hidden data-view="study">
        <div class="study-grid">
            <nav class="group-nav" aria-labelledby="groups-h">
                <h2 id="groups-h">Groups</h2>
                <div id="group-list" style="display: contents"></div>
            </nav>

            <section class="study-main" aria-labelledby="group-h">
                <div class="study-head">
                    <div style="display: flex; flex-direction: column; gap: 4px">
                        <h1 id="group-h" tabindex="-1">Group 1</h1>
                        <p class="muted" id="group-range"></p>
                    </div>
                    <a class="btn btn-primary" id="quiz-group" href="game.html?group=1">Quiz this group</a>
                </div>
                <div class="chips" role="group" aria-label="Filter words" id="filter-chips"></div>
                <div class="word-cards" id="word-cards" aria-live="polite"></div>
            </section>

            <aside class="settings-col" aria-label="Reading settings and tips">
                <section class="card settings" aria-labelledby="settings-h">
                    <h2 id="settings-h">Reading settings</h2>
                    <div>
                        <span class="setting-label" id="size-l">Text size</span>
                        <div class="size-group" role="group" aria-labelledby="size-l">
                            <button type="button" class="size-btn" data-size="small" style="font-size: 0.875rem" aria-label="Small text">A</button>
                            <button type="button" class="size-btn" data-size="medium" style="font-size: 1.0625rem" aria-label="Medium text">A</button>
                            <button type="button" class="size-btn" data-size="large" style="font-size: 1.3125rem" aria-label="Large text">A</button>
                        </div>
                    </div>
                    <button type="button" class="switch" role="switch" data-setting="easyRead" aria-checked="false">Easy-read font<span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span></button>
                    <button type="button" class="switch" role="switch" data-setting="reduceMotion" aria-checked="false">Reduce motion<span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span></button>
                    <button type="button" class="switch" role="switch" data-setting="highContrast" aria-checked="false">High contrast<span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span></button>
                    <div>
                        <label class="setting-label" for="voice-speed">Voice speed: <span id="voice-speed-value">0.8×</span></label>
                        <input class="range" id="voice-speed" type="range" min="0.5" max="1.2" step="0.1" value="0.8">
                    </div>
                </section>
                <section class="tip" aria-label="Tip from Professor Lexi">
                    <p class="tip-title">Lexi’s tip</p>
                    <p id="tip-text">Say each syllable out loud as you spell.</p>
                </section>
            </aside>
        </div>
    </main>

    <nav class="bottom-nav" aria-label="Main">
        <a href="index.html" data-nav="home"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
        <a href="game.html" data-nav="exam"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>Exam</a>
        <a href="game.html?view=study" data-nav="study"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5M9 7h6"/></svg>Study</a>
        <a href="parent.html" data-nav="parent"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Parent</a>
    </nav>

    <script>
        const params = new URLSearchParams(location.search);
        const VIEW = params.get('view') === 'study' ? 'study' : 'exam';

        const ICON_SPEAKER = '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
        const ICON_SPEAKER_SM = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>';
        const ICON_CHECK = '<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M7.5 12.5l3 3 6-6"/></svg>';
        const ICON_CROSS = '<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9 9l6 6M15 9l-6 6"/></svg>';
        const ICON_STAR = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>';

        let WORDS = [];
        let GOAL = 33;
        let GROUPS = [];
        let progress = SB.getProgress();

        SB.initHeader(VIEW);
        document.querySelectorAll('main[data-view]').forEach(m => {
            m.hidden = m.dataset.view !== VIEW;
        });
        // Keep the skip link pointing at the visible view.
        if (VIEW === 'study') {
            document.getElementById('main').removeAttribute('id');
            document.getElementById('main-study').id = 'main';
            document.title = 'Spelling Bee 2027 – Study';
        }

        SB.loadWords().then(data => {
            WORDS = data.words;
            GOAL = data.goal;
            for (let g = 1; g <= data.totalGroups; g++) {
                const list = WORDS.filter(w => w.group === g);
                if (list.length) GROUPS.push({ n: g, words: list, range: `${list[0].word} to ${list[list.length - 1].word}` });
            }
            if (VIEW === 'exam') initExam();
            else initStudy();
        }).catch(() => {
            const target = VIEW === 'exam' ? document.getElementById('exam-area') : document.getElementById('word-cards');
            target.innerHTML = '<div class="feedback feedback-bad" role="alert"><div>The word list could not be loaded. Open this app from a web server (for example GitHub Pages), not by double-clicking the file.</div></div>';
        });

        // ===================== DAILY EXAM =====================
        // missed: the first try at this word was wrong, so the word must be retyped correctly before moving on.
        const exam = { pool: [], index: 0, result: null, typed: '', missed: false, attempts: 0, sessionCorrect: 0, label: '' };

        function initExam() {
            const kingdom = parseInt(params.get('kingdom'), 10);
            const group = parseInt(params.get('group'), 10);
            const mode = params.get('mode');
            const quest = SB.QUESTS.find(q => q.id === kingdom);

            const select = document.getElementById('mode-select');
            const options = [{ value: 'all', text: 'All words' }, { value: 'missed', text: 'Missed words' }];
            if (quest) options.unshift({ value: 'kingdom', text: `Quest: ${quest.name}` });
            GROUPS.forEach(g => options.push({ value: `group-${g.n}`, text: `Group ${g.n} (${g.range})` }));
            let current = 'all';
            if (quest) current = 'kingdom';
            else if (mode === 'missed') current = 'missed';
            else if (GROUPS.some(g => g.n === group)) current = `group-${group}`;
            select.innerHTML = options.map(o => `<option value="${o.value}"${o.value === current ? ' selected' : ''}>${SB.esc(o.text)}</option>`).join('');
            select.addEventListener('change', () => {
                const v = select.value;
                if (v === 'kingdom') location.href = `game.html?kingdom=${kingdom}`;
                else if (v === 'missed') location.href = 'game.html?mode=missed';
                else if (v.startsWith('group-')) location.href = `game.html?group=${v.slice(6)}`;
                else location.href = 'game.html';
            });

            if (current === 'kingdom') exam.pool = SB.shuffle(WORDS).slice(0, 33);
            else if (current === 'missed') exam.pool = SB.shuffle(WORDS.filter(w => progress.incorrectWordsCount[w.word]));
            else if (current.startsWith('group-')) exam.pool = SB.shuffle(GROUPS.find(g => g.n === group).words);
            else exam.pool = SB.shuffle(WORDS);

            renderExam();
        }

        function updateGoal() {
            const score = SB.todayScore(progress);
            document.getElementById('today-count').textContent = `${score.correct} correct today`;
            const bar = document.getElementById('goal-bar');
            bar.setAttribute('aria-valuemax', GOAL);
            bar.setAttribute('aria-valuenow', Math.min(score.correct, GOAL));
            bar.setAttribute('aria-valuetext', `${score.correct} of ${GOAL} words correct today`);
            document.getElementById('goal-fill').style.width = `${Math.min(100, score.correct / GOAL * 100)}%`;
            const total = exam.pool.length;
            document.getElementById('word-count').textContent = total ? `Word ${Math.min(exam.index + 1, total)} of ${total}` : 'No words';
        }

        function renderExam(focusTarget) {
            updateGoal();
            const area = document.getElementById('exam-area');

            if (!exam.pool.length) {
                area.innerHTML = `
                    <div class="card spell-panel">
                        <h2>No words here yet</h2>
                        <p>${params.get('mode') === 'missed' ? 'You have no missed words in this list. Great job! Try all words or pick a group.' : 'This list has no words.'}</p>
                        <div class="hero-actions"><a class="btn btn-primary" href="game.html">Practise all words</a><a class="btn btn-outline" href="game.html?view=study">Study a group</a></div>
                    </div>`;
                return;
            }

            if (exam.index >= exam.pool.length) {
                area.innerHTML = `
                    <div class="card spell-panel">
                        <h2 id="done-h" tabindex="-1">Session complete!</h2>
                        <p style="font-size: 1.125rem">You spelled ${exam.sessionCorrect} of ${exam.pool.length} words correctly. Professor Lexi is proud of you!</p>
                        <div class="hero-actions"><button type="button" class="btn btn-primary" id="restart-btn">Practise again</button><a class="btn btn-outline" href="index.html">Back to home</a></div>
                    </div>`;
                document.getElementById('restart-btn').addEventListener('click', () => location.reload());
                document.getElementById('done-h').focus();
                return;
            }

            const w = exam.pool[exam.index];
            const answered = exam.result === 'correct';
            const retrying = exam.missed && !answered;
            const score = SB.todayScore(progress);

            // While retrying, the correct word, meaning and example sit above the input so no scrolling is needed.
            let retryPanel = '';
            if (retrying) {
                retryPanel = `
                    <div class="feedback feedback-bad">
                        ${ICON_CROSS}
                        <div style="flex-grow: 1"><p class="feedback-title">${exam.attempts > 1 ? 'Still not quite — try again.' : 'Not quite — let’s fix it.'}</p><p class="feedback-body">You typed “${SB.esc(exam.typed)}”. Study the correct spelling, then type it again below.</p></div>
                    </div>
                    <div class="answer-card">
                        <p class="answer-label">The correct spelling</p>
                        <div class="answer-word-row">
                            <p class="answer-word">${SB.esc(w.word)}</p>
                            <button type="button" class="small-listen" id="hear-again-btn" aria-label="Listen to ${SB.esc(w.word)}">${ICON_SPEAKER_SM}Listen</button>
                        </div>
                        <p class="answer-letters">${SB.esc(w.word.toUpperCase().split('').join(' - '))}</p>
                        ${w.pron || w.pos ? `<div class="meta-row">${w.pron ? `<span class="pron">${SB.esc(w.pron)}</span>` : ''}${w.pos ? `<span class="pos-tag">${SB.esc(w.pos)}</span>` : ''}</div>` : ''}
                        ${w.alt ? `<p class="muted" style="font-size: 0.875rem">Also spelled: ${SB.esc(w.alt)}</p>` : ''}
                        <dl class="answer-details">
                            <dt>Meaning</dt>
                            <dd>${SB.esc(w.def || 'No definition available.')}</dd>
                            ${w.example ? `<dt>Sample sentence</dt><dd class="word-example">${SB.esc(w.example)}</dd>` : ''}
                        </dl>
                    </div>`;
            }

            let feedback = '';
            if (exam.result === 'correct') {
                feedback = `
                    <div class="feedback feedback-good">
                        ${ICON_CHECK}
                        <div style="flex-grow: 1"><p class="feedback-title">${exam.missed ? 'That’s it! Now you’ve got it.' : 'Correct! Wonderful!'}</p><p class="feedback-body">${SB.esc(w.word)} is spelled ${SB.esc(w.word.toUpperCase().split('').join('-'))}.</p></div>
                        <button type="button" class="next-btn" id="next-btn">Next word</button>
                    </div>`;
            } else if (exam.result === 'empty') {
                feedback = `<div class="feedback feedback-info"><div>Type the word first, then press Check.</div></div>`;
            }
            if (exam.result === 'correct' && !exam.missed && score.correct === GOAL) {
                feedback += `<div class="celebrate" style="margin-top: 12px">You reached today’s goal of ${GOAL} words! Amazing job, Vivian!</div>`;
            }

            const clues = [];
            if (w.pos) clues.push(`<dt>Part of speech</dt><dd>${SB.esc(w.pos)}</dd>`);
            clues.push(`<dt>Definition</dt><dd>${SB.esc(w.def || 'No definition available.')}</dd>`);

            area.innerHTML = `
                <div class="exam-grid">
                    <section class="listen-panel" aria-label="Listen">
                        <div class="lexi-row">
                            <img class="lexi-avatar" src="images/lexi-avatar.png" alt="" width="120" height="120">
                            <p class="bubble">Listen carefully, then spell it. You can hear it as many times as you like!</p>
                        </div>
                        <button type="button" class="listen-btn" id="listen-btn">${ICON_SPEAKER}Listen to the word</button>
                        <div class="two-up">
                            <button type="button" class="btn-soft" id="slow-btn">Say it slower</button>
                            <button type="button" class="btn-soft" id="sentence-btn"${w.example ? '' : ' disabled'}>Hear a sentence</button>
                        </div>
                    </section>

                    <section class="card spell-panel" id="spell-panel" aria-label="Spell the word">
                        ${retrying ? `<div aria-live="polite" style="display: flex; flex-direction: column; gap: 16px">${retryPanel}</div>` : `<dl class="clues">${clues.join('')}</dl>`}
                        <form class="spell-form" id="spell-form" novalidate>
                            <label for="answer">${retrying ? 'Now type the correct spelling' : 'Type the word you hear'}</label>
                            <div class="spell-row">
                                <input class="spell-input" id="answer" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-describedby="answer-tip"${answered ? ' disabled' : ''} value="${answered ? SB.esc(exam.typed) : ''}">
                                <button type="submit" class="check-btn"${answered ? ' disabled' : ''}>Check</button>
                            </div>
                            <p id="answer-tip" class="muted" style="font-size: 0.9375rem">Press Enter to check. Capital letters don’t matter.</p>
                        </form>
                        <div aria-live="polite" id="feedback">${feedback}</div>
                    </section>
                </div>`;

            document.getElementById('listen-btn').addEventListener('click', () => SB.playWord(w));
            document.getElementById('slow-btn').addEventListener('click', () => SB.playWord(w, true));
            document.getElementById('sentence-btn').addEventListener('click', () => SB.speak(w.example, SB.getSettings().voiceRate));
            document.getElementById('spell-form').addEventListener('submit', e => {
                e.preventDefault();
                checkAnswer(w);
            });
            const hearAgain = document.getElementById('hear-again-btn');
            if (hearAgain) hearAgain.addEventListener('click', () => SB.playWord(w));
            const next = document.getElementById('next-btn');
            if (next) next.addEventListener('click', nextWord);

            if (focusTarget === 'next' && next) next.focus();
            else if (focusTarget === 'retry') {
                // On stacked (phone/tablet) layouts the listen panel sits above; bring the answer and input into view.
                document.getElementById('spell-panel').scrollIntoView({ block: 'start' });
                document.getElementById('answer').focus({ preventScroll: true });
            }
            else if (focusTarget === 'answer') document.getElementById('answer').focus();
        }

        function checkAnswer(w) {
            const typed = document.getElementById('answer').value.trim();
            if (!typed) {
                exam.result = 'empty';
                renderExam('answer');
                return;
            }
            exam.typed = typed;
            exam.attempts++;
            const isRight = typed.toLowerCase() === w.word.toLowerCase();

            // Retries after a miss don't change the score; only the first try counts.
            if (exam.missed) {
                exam.result = isRight ? 'correct' : 'wrong';
                renderExam(isRight ? 'next' : 'retry');
                return;
            }

            // Re-read before saving so a tab left open from an earlier day can't overwrite newer records.
            progress = SB.getProgress();
            const today = SB.todayKey();
            if (!progress.scores[today]) progress.scores[today] = { correct: 0, total: 0 };
            progress.scores[today].total++;
            if (isRight) {
                exam.result = 'correct';
                exam.sessionCorrect++;
                progress.scores[today].correct++;
                progress.correctWords[w.word] = (progress.correctWords[w.word] || 0) + 1;
            } else {
                exam.result = 'wrong';
                exam.missed = true;
                progress.incorrectWordsCount[w.word] = (progress.incorrectWordsCount[w.word] || 0) + 1;
                // Per-day record for the Parent page: which words were missed that day, and what was typed.
                const day = progress.scores[today];
                if (!day.wrong) day.wrong = {};
                day.wrong[w.word] = (day.wrong[w.word] || 0) + 1;
                progress.lastMissed[w.word] = today;
                progress.lastTyped[w.word] = typed;
            }
            SB.saveProgress(progress);
            SB.recordAnswer(w.word, isRight, typed);
            renderExam(isRight ? 'next' : 'retry');
        }

        function nextWord() {
            exam.index++;
            exam.result = null;
            exam.typed = '';
            exam.missed = false;
            exam.attempts = 0;
            renderExam('answer');
        }

        // ===================== STUDY =====================
        const study = { group: 1, filter: 'all' };

        function initStudy() {
            const g = parseInt(params.get('group'), 10);
            study.group = GROUPS.some(x => x.n === g) ? g : GROUPS[0].n;
            document.getElementById('groups-h').textContent = `${GROUPS.length} groups`;
            initSettings();
            renderStudy();
        }

        function renderStudy(focusHeading) {
            const group = GROUPS.find(g => g.n === study.group);
            const missed = group.words.filter(w => progress.incorrectWordsCount[w.word]);
            const starred = group.words.filter(w => progress.starred[w.word]);

            document.getElementById('group-list').innerHTML = GROUPS.map(g => `
                <button type="button" class="group-btn" data-group="${g.n}"${g.n === study.group ? ' aria-current="true"' : ''}>
                    <strong>Group ${g.n}</strong><span>${SB.esc(g.range)}</span>
                </button>`).join('');
            document.querySelectorAll('.group-btn').forEach(b => b.addEventListener('click', () => {
                study.group = parseInt(b.dataset.group, 10);
                study.filter = 'all';
                history.replaceState(null, '', `game.html?view=study&group=${study.group}`);
                renderStudy(true);
            }));

            document.getElementById('group-h').textContent = `Group ${group.n}`;
            document.getElementById('group-range').textContent = `${group.range} · ${group.words.length} words`;
            document.getElementById('quiz-group').href = `game.html?group=${group.n}`;

            const chips = [
                { key: 'all', label: `All ${group.words.length}` },
                { key: 'review', label: `To review ${missed.length}` },
                { key: 'starred', label: `Starred ${starred.length}` }
            ];
            document.getElementById('filter-chips').innerHTML = chips.map(c =>
                `<button type="button" class="chip" data-filter="${c.key}" aria-pressed="${c.key === study.filter}">${c.label}</button>`).join('');
            document.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
                study.filter = b.dataset.filter;
                renderStudy();
                document.querySelector(`.chip[data-filter="${study.filter}"]`).focus();
            }));

            const shown = study.filter === 'review' ? missed : study.filter === 'starred' ? starred : group.words;
            const cards = document.getElementById('word-cards');
            if (!shown.length) {
                cards.innerHTML = `<p class="empty-note">${study.filter === 'review' ? 'No missed words in this group yet.' : 'No starred words yet. Tap the star on a word to save it here.'}</p>`;
            } else {
                cards.innerHTML = shown.map(w => {
                    const i = WORDS.indexOf(w);
                    const isStarred = !!progress.starred[w.word];
                    const meta = [];
                    if (w.pron) meta.push(`<span class="pron">${SB.esc(w.pron)}</span>`);
                    if (w.pos) meta.push(`<span class="pos-tag">${SB.esc(w.pos)}</span>`);
                    return `
                        <article class="word-card">
                            <div class="word-card-top">
                                <h3>${SB.esc(w.word)}</h3>
                                <button type="button" class="star-btn" data-star="${i}" aria-pressed="${isStarred}" aria-label="Star ${SB.esc(w.word)}">${ICON_STAR}</button>
                            </div>
                            ${meta.length ? `<div class="meta-row">${meta.join('')}</div>` : ''}
                            ${w.alt ? `<p class="muted" style="font-size: 0.875rem">Also spelled: ${SB.esc(w.alt)}</p>` : ''}
                            <p class="word-def">${SB.esc(w.def || 'No definition available.')}</p>
                            ${w.example ? `<p class="word-example">${SB.esc(w.example)}</p>` : ''}
                            <button type="button" class="small-listen" data-listen="${i}" aria-label="Listen to ${SB.esc(w.word)}">${ICON_SPEAKER_SM}Listen</button>
                        </article>`;
                }).join('');
            }
            cards.querySelectorAll('[data-listen]').forEach(b => b.addEventListener('click', () => SB.playWord(WORDS[b.dataset.listen])));
            cards.querySelectorAll('[data-star]').forEach(b => b.addEventListener('click', () => {
                const w = WORDS[b.dataset.star];
                progress = SB.getProgress();
                if (progress.starred[w.word]) delete progress.starred[w.word];
                else progress.starred[w.word] = true;
                SB.saveProgress(progress);
                const on = !!progress.starred[w.word];
                b.setAttribute('aria-pressed', on);
                document.querySelector('.chip[data-filter="starred"]').textContent = `Starred ${group.words.filter(x => progress.starred[x.word]).length}`;
                if (study.filter === 'starred' && !on) {
                    renderStudy();
                    document.querySelector('.chip[data-filter="starred"]').focus();
                }
            }));

            const tipWord = group.words.find(w => w.pron);
            document.getElementById('tip-text').textContent = tipWord
                ? `Say each syllable out loud as you spell. Try it: ${tipWord.word} sounds like ${tipWord.pron}.`
                : 'Say each syllable out loud as you spell, then write the word from memory.';

            if (focusHeading) document.getElementById('group-h').focus();
        }

        function initSettings() {
            const s = SB.getSettings();
            const sync = () => {
                document.querySelectorAll('.size-btn').forEach(b => b.setAttribute('aria-pressed', b.dataset.size === s.textSize));
                document.querySelectorAll('.switch').forEach(b => b.setAttribute('aria-checked', !!s[b.dataset.setting]));
                document.getElementById('voice-speed').value = s.voiceRate;
                document.getElementById('voice-speed-value').textContent = `${s.voiceRate.toFixed(1)}×`;
            };
            document.querySelectorAll('.size-btn').forEach(b => b.addEventListener('click', () => {
                s.textSize = b.dataset.size;
                SB.saveSettings(s);
                sync();
            }));
            document.querySelectorAll('.switch').forEach(b => b.addEventListener('click', () => {
                s[b.dataset.setting] = !s[b.dataset.setting];
                SB.saveSettings(s);
                sync();
            }));
            const speed = document.getElementById('voice-speed');
            speed.addEventListener('input', () => {
                s.voiceRate = parseFloat(speed.value);
                SB.saveSettings(s);
                sync();
            });
            speed.addEventListener('change', () => SB.speak('This is my reading speed.', s.voiceRate));
            sync();
        }
    </script>
</body>
</html>
